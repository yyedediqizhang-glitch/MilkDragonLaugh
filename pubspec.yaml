name: edu_snap
description: "EDU SNAP - a Flutter workshop demo app built with an MVC structure."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the .arb files.
  generate: true
